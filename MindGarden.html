  sources: [
    {id:'s1',title:'LLM Wiki：让知识持续积累',type:'link',url:'https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f',author:'Andrej Karpathy',date:'2026-10-13',status:'compiled',tags:['知识管理','AI'],content:'LLM Wiki 将知识库分为三个层次：不可变的原始资料、持续编译的 Wiki，以及规定组织方式的 Schema。新资料到来时，不只是存储或检索，而是更新概念、主题总结和交叉引用。查询结果也可以回存为知识页。维护过程需要检查孤立页面、缺失链接、过时观点与矛盾。'},
    {id:'s2',title:'Building a Second Brain · 阅读笔记',type:'note',url:'https://www.buildingasecondbrain.com/',author:'我的阅读笔记',date:'2026-10-12',status:'compiled',tags:['知识管理','阅读'],content:'第二大脑是一个可信赖的外部知识系统。CODE 工作流包括 Capture 收集、Organize 组织、Distill 提炼、Express 表达。PARA 用项目、领域、资源、归档组织资料。收集时优先保留对自己有用的信息，让笔记服务于实际输出。'},
    {id:'s3',title:'原子笔记与双向链接：实践记录',type:'note',author:'我的实践记录',date:'2026-10-11',status:'compiled',tags:['知识管理','写作'],content:'一条笔记围绕一个清晰的想法，用自己的语言解释，并链接到相关笔记。双向链接帮助发现上下文与意外联系。写作时从多个原子笔记组合论证，而不是重新从空白开始。笔记要保留来源，以便回顾推理依据。'},
    {id:'s4',title:'Retrieval-Augmented Generation · 论文摘要笔记',type:'link',url:'https://arxiv.org/abs/2005.11401',author:'Lewis et al. · 摘要笔记',date:'2026-10-10',status:'compiled',tags:['AI','研究'],content:'RAG 将参数化模型与外部检索结合。检索器找到相关文本片段，生成模型结合这些片段构造答案。知识可以在外部更新，引用让答案更易追溯。检索质量、文档切分和答案评估会影响最终体验。'},
    {id:'s5',title:'渐进式总结：从高亮到自己的观点',type:'note',author:'我的阅读笔记',date:'2026-10-09',status:'compiled',tags:['阅读','知识管理'],content:'渐进式总结通过逐层提炼降低未来阅读成本：保存原文，选出重点，概括核心观点，最后用自己的语言写出可复用的结论。不是每一篇资料都需要同样深的处理，关注当前目标。'},
    {id:'s6',title:'认知负荷与界面设计 · 观察笔记',type:'note',author:'我的设计观察',date:'2026-10-08',status:'compiled',tags:['产品设计','学习'],content:'工作记忆容量有限。界面需要减少无关选择，分组展示信息，逐步披露复杂选项，并提供清晰反馈。识别比回忆更轻松，因此可见的导航和有意义的标签可以帮助用户。'},
    {id:'s7',title:'如何让阅读真正变成输出？',type:'note',author:'灵感速记',date:'2026-10-13',status:'raw',tags:['阅读','写作'],content:'读完文章后，尝试回答三个问题：它改变了我什么想法？能和已有的哪条笔记连接？我可以用它做什么？把答案写成一个短段落。每周选择一个问题，用已有笔记写一篇小文章。收集只是开始，表达才会暴露理解中的空白。'},
    {id:'s8',title:'知识花园的维护清单',type:'note',author:'灵感速记',date:'2026-10-12',status:'raw',tags:['知识管理'],content:'每周花十五分钟维护知识花园：查看没有链接的笔记，为它们寻找上下文；检查没有来源的结论；合并重复概念；记录还没有答案的问题。让知识库随着好奇心生长，而不是不断堆积。'}
  ],
  pages: [
    {id:'p1',title:'LLM Wiki',subtitle:'从资料仓库，到会生长的知识库',category:'AI',kind:'概念',icon:'sprout',date:'2026-10-13',star:true,tags:['AI','知识管理'],sources:['s1'],links:['p2','p3','p4','p5'],content:'# LLM Wiki\n\nLLM Wiki 的核心，是在原始资料和问答之间，建立一个**持续积累的知识层**。每一次阅读、提问和思考，都能让已有页面变得更完整。\n\n## 三层结构\n\n- **Raw · 原始资料**：保留收集的原文，作为可追溯的依据。\n- **Wiki · 编译知识**：将资料整理成概念、主题和综合分析，保持交叉链接。\n- **Schema · 组织规则**：规定页面结构、标签和更新流程。\n\n## 三种操作\n\n1. 收集并编译：提取要点，更新相关的知识页。\n2. 带来源问答：从已有知识中探索问题，将有价值的回答回存。\n3. 定期维护：检查孤立页面、无来源结论和缺失链接。\n\n## 我的理解\n\n收藏不是理解的终点。知识的价值在于它和已有想法发生了什么连接。相比每次重新检索，持续维护的 Wiki 让理解能够复利。\n\n> 把每一份资料，当作一颗种子；把每一个关联，当作新的枝条。\n\n## 相关知识\n\n参见 [[第二大脑]]、[[双向链接]] 和 [[RAG 与 LLM Wiki]]。'},
    {id:'p2',title:'第二大脑',subtitle:'为重要的想法，建立可靠的外部记忆',category:'知识管理',kind:'概念',icon:'brain',date:'2026-10-12',star:true,tags:['知识管理','学习'],sources:['s2','s5'],links:['p1','p6','p7','p8'],content:'# 第二大脑\n\n第二大脑是一套保存、组织和重新使用信息的方法。它的目的，是让知识帮助我们完成真实的项目。\n\n## CODE 工作流\n\n- **收集 Capture**：保留产生共鸣、与目标有关的材料。\n- **组织 Organize**：按行动的需要整理，而不只是按学科分类。\n- **提炼 Distill**：找到以后值得重新阅读的重点。\n- **表达 Express**：通过写作、设计或项目把知识用于实践。\n\n## 一个小实践\n\n读完一篇文章后，先写一句话：这篇文章对我正在做的事情有什么帮助？如果没有明确用途，可以先放到资源区，等问题出现时再深入整理。\n\n## 相关知识\n\n[[PARA 组织法]] 解决放在哪里，[[渐进式总结]] 解决留下什么，[[从阅读到输出]] 解决如何使用。'},
    {id:'p3',title:'双向链接',subtitle:'让想法之间的关系变得可见',category:'知识管理',kind:'方法',icon:'link',date:'2026-10-11',star:false,tags:['知识管理','写作'],sources:['s3'],links:['p1','p4','p9'],content:'# 双向链接\n\n普通链接从一篇笔记指向另一篇；双向链接让被引用的笔记也能看到它的上下文。\n\n## 连接的三种方式\n\n- 同一个主题的不同角度。\n- 一个概念和它的实际例子。\n- 两个看起来矛盾、值得比较的观点。\n\n## 避免只为了连接而连接\n\n每条链接都可以附上一句理由：这两个想法为什么有关？有意义的连接比大量的链接更有帮助。\n\n## 相关知识\n\n[[原子笔记]] 提供连接的基本单位，[[知识图谱]] 让这些关系可见。'},
    {id:'p4',title:'原子笔记',subtitle:'一条笔记，一个能够被复用的想法',category:'知识管理',kind:'方法',icon:'file',date:'2026-10-11',star:false,tags:['知识管理','写作'],sources:['s3'],links:['p3','p8','p9'],content:'# 原子笔记\n\n原子笔记围绕一个清晰的想法展开，尽量独立、简洁，并用自己的语言表达。\n\n## 一条好笔记的结构\n\n1. 一个直接表达观点的标题。\n2. 一个解释观点的段落。\n3. 原始来源或支持这个想法的例子。\n4. 关联到已有笔记的链接。\n\n## 我的例子\n\n“表达能暴露理解的空白”比“读书笔记 10 月”更适合作为原子笔记的标题。前者可以被不同文章和项目复用。\n\n参见 [[双向链接]] 和 [[从阅读到输出]]。'},
    {id:'p5',title:'RAG 与 LLM Wiki',subtitle:'即时检索与持续编译，如何互相补充',category:'AI',kind:'综合',icon:'spark',date:'2026-10-13',star:true,tags:['AI','研究','知识管理'],sources:['s1','s4'],links:['p1','p10','p3'],content:'# RAG 与 LLM Wiki\n\nRAG 在提问时检索相关材料；LLM Wiki 在资料进入时就将要点融入持久的知识页。两种思路可以结合。\n\n## 即时检索\n\n适合从大量原始文档中寻找具体事实。答案质量依赖检索结果和生成过程，需保留引用以便核对。\n\n## 持续编译\n\n适合围绕一个研究方向长期积累。主题总结、跨文档关联和待验证问题可以沉淀下来，减少重复整理。\n\n## 组合使用\n\n先阅读 Wiki 获取主题结构，再查询原始资料核对细节。把新发现回存到知识页，同时保留资料引用。\n\n> 这是基于演示资料整理的比较笔记，具体系统的性能仍需单独评估。\n\n关联：[[LLM Wiki]]、[[检索增强生成]]。'},
    {id:'p6',title:'PARA 组织法',subtitle:'按行动的距离，给资料找到位置',category:'知识管理',kind:'方法',icon:'folder',date:'2026-10-10',star:false,tags:['知识管理','效率'],sources:['s2'],links:['p2','p7'],content:'# PARA 组织法\n\nPARA 将资料组织为四类，强调它们和行动之间的关系。\n\n- **Projects 项目**：有明确目标和期限的事情。\n- **Areas 领域**：需要长期维持的责任。\n- **Resources 资源**：感兴趣的主题和参考资料。\n- **Archives 归档**：已经结束或暂时不活跃的内容。\n\n## 应用到知识花园\n\n知识页按主题持续积累，项目通过链接引用这些知识。项目结束后可以归档项目页面，而方法和概念仍然保留。\n\n参见 [[第二大脑]]。'},
    {id:'p7',title:'渐进式总结',subtitle:'为未来的自己，降低重新阅读的成本',category:'阅读与写作',kind:'方法',icon:'layers',date:'2026-10-09',star:false,tags:['阅读','知识管理'],sources:['s5'],links:['p2','p8'],content:'# 渐进式总结\n\n资料可以随着使用逐层提炼，不必在第一次阅读时就整理到完美。\n\n## 四个层次\n\n1. 保留原始材料。\n2. 选出有价值的段落。\n3. 提炼最重要的观点。\n4. 用自己的语言写出可用的结论。\n\n## 注意\n\n高亮太多就失去了筛选的意义。整理的深度取决于当前的目标。\n\n参见 [[第二大脑]] 和 [[从阅读到输出]]。'},
    {id:'p8',title:'从阅读到输出',subtitle:'把“我读过”变成“我理解了”',category:'阅读与写作',kind:'综合',icon:'pen',date:'2026-10-08',star:false,tags:['阅读','写作','学习'],sources:['s2','s3'],links:['p2','p4','p7'],content:'# 从阅读到输出\n\n输出会迫使我们组织想法，并暴露理解中的空白。\n\n## 一个可以重复的小循环\n\n- 带着一个问题阅读。\n- 写下一个用自己的语言表达的想法。\n- 为这个想法找一个已有的关联。\n- 用短文、图示或实际项目表达它。\n\n## 每周练习\n\n从知识库选三个有关联的笔记，写一个不超过五百字的短文。记录哪里缺乏证据，再带着这个缺口去阅读。\n\n关联：[[原子笔记]]、[[渐进式总结]]。'},
    {id:'p9',title:'知识图谱',subtitle:'在关系中，发现下一个值得追问的问题',category:'知识管理',kind:'概念',icon:'network',date:'2026-10-07',star:false,tags:['知识管理','研究'],sources:['s1','s3'],links:['p3','p4','p1'],content:'# 知识图谱\n\n这里的图谱是知识页与它们之间关系的可视化。节点代表页面，边代表明确的关联。\n\n## 可以发现什么\n\n- 多个页面共同引用的关键概念。\n- 还没有连接到其他主题的孤立想法。\n- 两个主题之间可以进一步探索的桥梁。\n\n## 使用方法\n\n选择一个节点，阅读相关页面，再问：为什么它们被连接？有没有一个新的问题出现？\n\n关联：[[双向链接]] 和 [[LLM Wiki]]。'},
    {id:'p10',title:'检索增强生成',subtitle:'让回答获得外部知识的支持',category:'AI',kind:'概念',icon:'search',date:'2026-10-06',star:false,tags:['AI','研究'],sources:['s4'],links:['p5','p1'],content:'# 检索增强生成\n\n检索增强生成（RAG）先从外部知识集合中检索相关材料，再将它们提供给生成模型。\n\n## 基本流程\n\n1. 收集、切分和索引文档。\n2. 根据问题检索相关片段。\n3. 使用检索上下文构造回答。\n4. 检查答案与引用是否一致。\n\n## 需要注意\n\n引用并不自动等于正确。仍要确认引用是否真正支持结论，以及材料是否适用于当前问题。\n\n参见 [[RAG 与 LLM Wiki]]。'},
    {id:'p11',title:'认知负荷',subtitle:'让界面把复杂留给系统，把清晰留给人',category:'产品设计',kind:'概念',icon:'layout',date:'2026-10-05',star:false,tags:['产品设计','学习'],sources:['s6'],links:['p12','p2'],content:'# 认知负荷\n\n设计界面时，可以把注意力当作有限资源：减少无关信息，让关键选择清晰可见。\n\n## 三个设计实践\n\n- 把相近的信息放在一起。\n- 在需要时才显示复杂选项。\n- 操作后给出明确的状态反馈。\n\n## 在知园中的应用\n\n资料先进入收件箱，编译后进入知识库。阅读页面展示摘要、关联和来源，帮助用户保持上下文。\n\n关联：[[渐进式披露]]。'},
    {id:'p12',title:'渐进式披露',subtitle:'在恰当的时刻，展示恰当的复杂度',category:'产品设计',kind:'灵感',icon:'layout',date:'2026-10-04',star:false,tags:['产品设计'],sources:[],links:[],content:'# 渐进式披露\n\n先展示当前任务必需的信息，再让更深入的内容按需展开。\n\n## 待验证的想法\n\n知识页默认显示摘要与核心内容，来源和维护信息放到侧栏，是否能让阅读更专注？\n\n这是一个尚未关联资料的设计想法，可以在知识维护中补充来源和链接。'}
  ],

 function readerView(){const p=page(pageId);if(!p)return empty('知识页不存在','回到知识库继续探索。');const related=p.links.map(page).filter(Boolean),incoming=backlinks(p.id);return `<div class="reader-header"><button class="text-btn back" data-action="navigate" data-route="library">${icon('back')} 返回知识库</button><div class="reader-heading"><div><div class="card-icon">${icon(p.icon)}</div><p class="eyebrow">${esc(p.kind)} / ${esc(p.category)}</p><h1>${esc(p.title)}</h1><p class="reader-subtitle">${esc(p.subtitle)}</p><div class="reader-meta"><span>${icon('clock')} 更新于 ${esc(p.date)}</span><span>${icon('file')} ${p.sources.length} 个来源</span><span>${icon('link')} ${related.length} 个关联</span></div></div><div class="reader-actions">${ibtn('star','star',p.star?'取消收藏':'收藏知识页',`data-id="${esc(p.id)}"`,p.star?'active':'')}${ibtn('download','export-page','导出 Markdown',`data-id="${esc(p.id)}"`)}${btn('编辑','edit-page','pen','',`data-id="${esc(p.id)}"`)}</div></div></div><div class="reader-layout"><article class="article"><div class="markdown">${markdown(p.content)}</div><div class="article-bottom"><span>知识会随着新资料和你的思考，持续生长。</span><span>${esc(p.kind)} · 可编辑的知识</span></div></article><aside class="reader-aside"><section class="panel"><h3>相关知识 <span class="muted">${related.length}</span></h3>${related.map(x=>`<button class="aside-link" data-action="open-page" data-id="${esc(x.id)}">${icon('link')}${esc(x.title)}</button>`).join('')||'<p class="read-note">还没有关联。编辑时用 [[知识标题]] 建立连接。</p>'}</section><section class="panel"><h3>反向链接 <span class="muted">${incoming.length}</span></h3>${incoming.map(x=>`<button class="aside-link" data-action="open-page" data-id="${esc(x.id)}">${icon('back')}${esc(x.title)}</button>`).join('')||'<p class="read-note">还没有其他知识页引用这里。</p>'}</section><section class="panel"><h3>原始来源 <span class="muted">${p.sources.length}</span></h3>${p.sources.map(source).filter(Boolean).map((s,i)=>`<button class="source-reference" style="text-align:left;width:100%" data-action="source-detail" data-id="${esc(s.id)}"><span>${i+1}. ${esc(s.title)}</span><small>${esc(s.author||'我的资料')} · ${dateShort(s.date)}</small></button>`).join('')||'<p class="read-note">这是一条个人想法，尚未关联原始资料。</p>'}<div class="card-tags" style="margin-top:16px;margin-bottom:0">${tags(p)}</div></section></aside></div>`;}
 function graphView(){const p=page(graphSelected)||db.pages[0];if(p)graphSelected=p.id;return heading('EVERY IDEA IS CONNECTED','知识图谱','在熟悉的概念之间，发现意想不到的联系。',btn('添加知识','new-page','plus','primary'))+`<div class="graph-shell"><div class="graph-canvas"><div class="graph-legend">${[['知识管理',''],['AI',''],['阅读与写作','orange'],['产品设计','blue']].map(([t,c])=>`<span><i class="dot ${c}"></i>${t}</span>`).join('')}</div><svg id="knowledge-graph" viewBox="0 0 780 560" aria-label="可交互知识图谱，点击节点查看知识" role="img">${graphSVG()}</svg><div class="graph-tools">${ibtn('plus','zoom-in','放大图谱')}${ibtn('minus','zoom-out','缩小图谱')}${ibtn('reset','graph-reset','重置图谱')}</div></div><aside class="graph-detail" id="graph-detail">${graphDetail(p)}</aside></div><p class="count-description">${db.pages.length} 个节点 · ${edges().length} 条连接 · 拖动空白处移动图谱，滚轮缩放，点击节点探索。</p>`;}
 function positions(){const pos={};const groups=['知识管理','AI','阅读与写作','产品设计'];const centers=[[265,250],[548,190],[390,440],[625,435]];groups.forEach((c,k)=>{const arr=db.pages.filter(p=>p.category===c);arr.forEach((p,i)=>{const angle=i/Math.max(arr.length,1)*Math.PI*2-.5;pos[p.id]={x:centers[k][0]+(arr.length>1?Math.cos(angle)*(k===0?155:80):0),y:centers[k][1]+(arr.length>1?Math.sin(angle)*(k===0?145:60):0)}})});db.pages.filter(p=>!pos[p.id]).forEach((p,i)=>{pos[p.id]={x:70+(i%7)*85,y:45+Math.floor(i/7)*55}});return pos;}
 function graphSVG(){const pos=positions();return `<g id="graph-layer" transform="translate(${graphTransform.x} ${graphTransform.y}) scale(${graphTransform.scale})">${edges().map(([a,b])=>`<line class="graph-edge" x1="${pos[a].x}" y1="${pos[a].y}" x2="${pos[b].x}" y2="${pos[b].y}" opacity="${a===graphSelected||b===graphSelected?'1':'.6'}"/>`).join('')}${db.pages.map(p=>{const xy=pos[p.id],r=11+Math.min(p.links.length*2,9),color=p.category==='AI'?'#89a377':p.category==='阅读与写作'?'#d1b28a':p.category==='产品设计'?'#9fb2c7':'#aec594';return `<g class="graph-node ${p.id===graphSelected?'selected':''}" role="button" aria-label="选择 ${esc(p.title)}" tabindex="0" data-action="graph-select" data-id="${esc(p.id)}" transform="translate(${xy.x} ${xy.y})"><circle r="${r+6}" fill="#f6f9f0" opacity=".85"/><circle r="${r}" fill="${color}" stroke="#fcfdf8" stroke-width="3"/><text y="${r+19}" text-anchor="middle">${esc(p.title.length>12?p.title.slice(0,11)+'…':p.title)}</text></g>`}).join('')}</g>`;}
 function graphDetail(p){if(!p)return empty('种下第一颗种子','创建知识页后，它会出现在图谱里。','sprout');return `<p class="eyebrow">SELECTED NOTE</p><div class="card-icon" style="margin-top:21px">${icon(p.icon)}</div><h3>${esc(p.title)}</h3><p>${esc(p.subtitle)}</p><div class="card-tags" style="margin-top:14px;margin-bottom:0">${tags(p)}</div>${btn('阅读知识页','open-page','arrow','primary',`data-id="${esc(p.id)}"`)}<div class="graph-links-label">与这个想法相连</div>${[...new Set([...p.links,...backlinks(p.id).map(x=>x.id)])].map(page).filter(Boolean).slice(0,8).map(x=>`<button class="aside-link" data-action="graph-select" data-id="${esc(x.id)}">${icon('link')}${esc(x.title)}</button>`).join('')||'<p class="read-note">这条知识暂时独立。添加关联，让它成为花园的一部分。</p>'}`;}
 function updateGraph(){if(!$('#knowledge-graph'))return;$('#knowledge-graph').innerHTML=graphSVG();$('#graph-detail').innerHTML=graphDetail(page(graphSelected));}
 function bindGraph(){const svg=$('#knowledge-graph');let drag=null,moved=false;svg.addEventListener('pointerdown',e=>{if(e.target.closest('.graph-node'))return;drag={x:e.clientX,y:e.clientY,tx:graphTransform.x,ty:graphTransform.y};moved=false;svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const factor=780/svg.getBoundingClientRect().width;graphTransform.x=drag.tx+(e.clientX-drag.x)*factor;graphTransform.y=drag.ty+(e.clientY-drag.y)*factor;moved=true;$('#graph-layer').setAttribute('transform',`translate(${graphTransform.x} ${graphTransform.y}) scale(${graphTransform.scale})`)});svg.addEventListener('pointerup',()=>{drag=null});svg.addEventListener('wheel',e=>{e.preventDefault();graphTransform.scale=Math.max(.35,Math.min(2.3,graphTransform.scale+(e.deltaY>0?-.08:.08)));updateGraph()},{passive:false});}
 function askView(){return heading('EXPLORE WHAT YOU KNOW','问问知识库','让提问成为知识生长的一部分。')+`<div class="ask-layout"><div class="ask-intro"><div class="ask-symbol">${icon('spark')}</div><h2>从一个好问题开始。</h2><p>连接已有的知识，找到有来源的答案。</p></div><div class="ask-box"><textarea id="question" maxlength="500" placeholder="例如：如何把收藏的文章，变成真正可以复用的知识？" aria-label="你的问题">${esc(answer?.question||'')}</textarea><div class="bottom"><span>基于 ${db.pages.length} 个知识页 · 本地检索演示</span>${btn('探索答案','ask-submit','spark','primary')}</div></div><div class="notice">${icon('info')}<span>这是可交互的 mock 问答：本地检索相关知识并组合摘录，未连接真实 LLM。答案仅依据你的知识库，引用可点击核对。</span></div><div class="suggestions">${['RAG 和 LLM Wiki 有什么区别？','如何把阅读转化为输出？','怎样维护一个健康的知识库？'].map(q=>`<button class="suggestion" data-action="ask-suggestion" data-question="${q}">${icon('chat')}${q}</button>`).join('')}</div><div id="answer-area">${answer?answerView():''}</div>${db.questions.length?`<section class="history"><h3>最近的好问题</h3>${db.questions.slice(0,4).map(q=>`<button data-action="ask-suggestion" data-question="${esc(q.text)}">${esc(q.text)}<span>${dateShort(q.date)}</span></button>`).join('')}</section>`:''}</div>`;}
 function answerView(){if(!answer)return '';return `<article class="answer-panel"><div class="question-bubble">${icon('chat')}${esc(answer.question)}</div><div class="answer-label"><span class="flex">${icon('spark')}来自你的知识花园</span><span>MOCK · 可追溯的知识摘录</span></div><div class="markdown">${markdown(answer.content)}</div>${answer.pages.length?`<div class="answer-sources">${answer.pages.map((p,i)=>`<button class="citation-card" data-action="open-page" data-id="${esc(p.id)}"><span class="num">${i+1}</span>${esc(p.title)}<small>${p.sources.length} 份原始资料 · 点击核对</small></button>`).join('')}</div>`:''}<div class="answer-actions"><span>把有价值的探索，留在知识库里。</span>${answer.pages.length?btn(answer.saved?'已存为知识页':'存为知识页','save-answer','book','soft',answer.saved?'disabled':''):''}</div></article>`;}
 function tokens(s){const str=s.toLowerCase().replace(/[\s，。？！?、：:和与的了是什么怎么如何怎样一个]/g,' ');const words=str.split(/[^a-z0-9\u4e00-\u9fff]+/).filter(Boolean);const result=new Set(words);words.forEach(w=>{if(/[\u4e00-\u9fff]/.test(w))for(let i=0;i<w.length-1;i++)result.add(w.slice(i,i+2))});return [...result];}
 function rank(q){const terms=tokens(q);return db.pages.map(p=>{const title=(p.title+p.tags.join('')).toLowerCase(),body=(p.subtitle+p.content).toLowerCase();let score=terms.reduce((sum,t)=>sum+(title.includes(t)?5:body.includes(t)?1:0),0);if(/维护|健康|孤立/.test(q)&&/LLM Wiki|知识图谱|双向链接/.test(p.title))score+=4;return {p,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.p);}
 function makeAnswer(q){const ps=rank(q);let content;if(!ps.length){content='## 暂时没有找到支持这个问题的知识\n\n当前知识库中的材料不足以回答这个问题。可以换一个包含具体主题的问法，或者先收集相关资料，再来探索。';}else{content='## 我找到这些相关知识\n\n以下是本地检索到的知识摘要，请点击下方引用阅读完整页面：\n\n';ps.forEach((p,i)=>{const paras=p.content.split(/\n\s*\n/).filter(x=>!x.startsWith('#')&&!x.startsWith('>')&&!x.startsWith('关联')&&!x.startsWith('参见'));content+=`### ${i+1}. ${p.title}\n\n${paras[0]||p.subtitle}\n\n`;});if(/rag|wiki/i.test(q)&&ps.some(p=>p.id==='p5'))content+='## 可以继续思考\n\nWiki 先积累主题结构，RAG 按问题检索细节。可以结合二者：先读主题页，再用原始资料核对具体结论。\n\n';else if(/阅读|输出/.test(q))content+='## 下一步的小实践\n\n从以上知识中选择一个想法，用自己的语言写一个短段落，再链接到已有笔记。用一次真实的输出，检查自己理解了什么。\n\n';else content+='## 一个新的探索方向\n\n这些页面之间的共同点是什么？可以核对来源后，把你发现的联系整理成新的知识页。\n\n';content+='> 此回答是基于本地知识摘要的 mock 组合，不是模型推理结果。';}return {question:q,pages:ps,content,saved:false};}
 function issues(){const result=[];db.pages.forEach(p=>{if(!p.sources.some(id=>source(id)))result.push({type:'source',p,title:'缺少原始来源',detail:'这条知识尚未关联资料，补充依据后更容易回溯。'});if(!p.links.some(id=>page(id))&&!backlinks(p.id).length)result.push({type:'orphan',p,title:'一条尚未连接的想法',detail:'没有正向或反向链接，可以为它寻找相关的知识页。'});const broken=p.links.filter(id=>!page(id)).length+p.sources.filter(id=>!source(id)).length;if(broken)result.push({type:'broken',p,title:'存在失效引用',detail:`发现 ${broken} 条失效的知识或资料引用。`});const missing=[...p.content.matchAll(/\[\[([^\]]+)\]\]/g)].filter(m=>!db.pages.some(x=>x.title===m[1]));if(missing.length)result.push({type:'missing',p,title:'提及的知识尚未创建',detail:missing.map(m=>m[1]).join('、')});});return result;}
 function healthView(){const all=issues(),score=db.pages.length?Math.max(0,100-Math.round(new Set(all.map(i=>i.p.id)).size/db.pages.length*100)):100;return heading('KEEP YOUR GARDEN HEALTHY','知识维护','给知识一点照料，让理解持续清晰。',btn('重新检查','health-scan','health','primary'))+`<section class="health-summary"><div class="health-score"><b>${score}</b><span>花园健康度</span></div><div><h2>${all.length?'有几颗种子，值得多一点照料。':'你的知识花园，生长得很好。'}</h2><p>检查来源、孤立页面、失效引用与缺失概念。</p></div>${btn('查看关联图谱','navigate','network','','data-route="graph"')}</section><section class="health-grid">${[['来源待补充',all.filter(i=>i.type==='source').length,'file'],['孤立知识页',all.filter(i=>i.type==='orphan').length,'network'],['失效 / 缺失引用',all.filter(i=>['broken','missing'].includes(i.type)).length,'link']].map(([t,n,ic])=>`<div class="health-stat"><div class="flex">${icon(ic)}${t}</div><b>${n}</b><small>项待处理</small></div>`).join('')}</section><div class="section-title"><h2>需要关注</h2><span class="small muted">${all.length} 项 · 规则检查</span></div>${all.map(i=>`<div class="issue"><span class="card-icon">${icon(i.type==='source'?'file':'link')}</span><div class="info"><h3>${esc(i.p.title)} · ${i.title}</h3><p>${esc(i.detail)}</p></div>${btn(i.type==='source'?'关联资料':i.type==='orphan'?'添加关联':i.type==='broken'?'清理引用':'补充知识','fix-issue','plus','soft',`data-id="${esc(i.p.id)}" data-type="${i.type}"`)}</div>`).join('')||`<div class="panel">${empty('所有基础检查已通过','继续收集新的资料。观点是否正确、是否过时，仍需要你结合原文判断。','check')}</div>`}<div class="info-strip" style="margin-top:22px">${icon('info')}<span>维护使用可验证的结构规则，不自动判断观点矛盾或事实真伪。个人灵感可以暂时没有来源。</span></div>`;}
 function settingsView(){return heading('A SPACE OF YOUR OWN','花园设置','让知识库以你喜欢的方式生长。')+`<div class="settings-layout"><section class="settings-panel"><h2>我的空间</h2><div class="field"><label for="garden-name">知识花园名称</label><input id="garden-name" maxlength="30" value="${esc(db.settings.name)}"></div>${btn('保存名称','save-settings','check','primary')}<div class="setting-row"><div><h3>自动识别知识链接</h3><p>保存时，将 [[知识标题]] 识别为已有知识页的关联。</p></div><button class="toggle ${db.settings.autoLink?'on':''}" role="switch" aria-checked="${db.settings.autoLink}" aria-label="自动识别链接" data-action="toggle-autolink"></button></div></section><section class="settings-panel"><h2>数据与备份</h2><div class="setting-row"><div><h3>导出完整知识库</h3><p>JSON 包含原始资料、知识页、链接与花园足迹，可重新导入。</p></div>${btn('导出备份','export-data','download')}</div><div class="setting-row"><div><h3>导入已有备份</h3><p>从知园 JSON 恢复数据，先预览统计再确认替换。</p></div>${btn('导入备份','import-backup','upload')}</div><div class="setting-row"><div><h3>重置演示空间</h3><p>清除当前浏览器的修改，恢复初始 mock 数据。</p></div>${btn('重置数据','reset-confirm','reset','danger')}</div><p class="read-note" style="margin-top:18px">数据仅保存在当前浏览器的 localStorage，不会跨设备同步。清理浏览器数据会移除你的修改，请定期导出备份。</p></section><section class="settings-panel"><h2>关于知园</h2><p class="read-note">知园参考 <a href="https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f" target="_blank" rel="noopener noreferrer">Andrej Karpathy 的 LLM Wiki 理念 ${icon('external')}</a>：让知识在收集、编译、探索与维护的循环中持续积累。</p><div class="architecture"><div><b>01 / RAW</b><p>原始资料完整保留<br>为每个结论留下依据</p></div><div><b>02 / WIKI</b><p>可编辑的结构化知识<br>双向链接与引用关系</p></div><div><b>03 / SCHEMA</b><p>知识组织与维护规则<br>索引、标签和操作日志</p></div></div><p class="read-note" style="margin-top:17px">当前版本为功能完整的前端原型。编译采用文本提炼与标签关联，问答采用本地检索组合；示例内容为演示笔记，不是链接页面的完整原文。</p></section></div>`;}
 function openModal(type,payload={}){previousFocus=document.activeElement;modal={type,...payload};renderModal();document.body.style.overflow='hidden';setTimeout(()=>{const target=$('#overlay-root input:not([type="checkbox"]):not([type="file"]), #overlay-root textarea, #overlay-root button');target?.focus()},30);}

 function modalFrame(title,subtitle,body,footer='',large=false){return `<div class="overlay" data-action="overlay-close"><section class="modal ${large?'large':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${ibtn('close','close-modal','关闭弹窗')}</div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</section></div>`;}
 function renderModal(){let html='';const m=modal;if(!m)return;switch(m.type){
 case 'add':{const mode=m.mode||'note';html=modalFrame('种下一份新的好奇','收集只是开始，让资料与已有知识发生连接。',`<div class="modal-tabs">${[['note','文本笔记','pen'],['link','网页资料','link'],['file','本地文件','upload']].map(([id,t,n])=>`<button class="${mode===id?'active':''}" data-action="import-tab" data-mode="${id}">${icon(n)}${t}</button>`).join('')}</div><form id="source-form"><div class="field"><label for="source-title">资料标题 *</label><input id="source-title" maxlength="150" required placeholder="给这份资料一个清晰的名字" value="${esc(m.draft?.title||'')}"></div>${mode==='link'?`<div class="field"><label for="source-url">网页链接 *</label><input id="source-url" type="url" placeholder="https://…" value="${esc(m.draft?.url||'')}"><span class="hint">保留链接用于追溯；请粘贴正文，本演示不会抓取网页。</span></div>`:''}${mode==='file'?`<label class="upload-area" for="source-file">${icon('upload')}<p>${esc(m.filename||'选择一份文本文件')}</p><small>支持 .txt / .md · 最大 2 MB</small><input class="hidden" id="source-file" type="file" accept=".txt,.md,text/plain,text/markdown"></label>`:''}<div class="field"><label for="source-content">${mode==='link'?'粘贴正文 *':mode==='file'?'文件正文（可检查内容） *':'笔记内容 *'}</label><textarea id="source-content" maxlength="1500000" placeholder="文章要点、读书摘记，或者一个刚刚冒出的想法…">${esc(m.draft?.content||'')}</textarea></div><div class="form-row"><div class="field"><label for="source-tags">标签（用逗号分隔）</label><input id="source-tags" maxlength="100" placeholder="知识管理, 阅读" value="${esc(m.draft?.tags||'')}"></div><div class="field"><label for="source-author">作者 / 来源</label><input id="source-author" maxlength="100" placeholder="我的资料" value="${esc(m.draft?.author||'')}"></div></div><p id="form-error" class="inline-error" role="alert"></p></form>`,`<span class="hint">原始资料保留在收件箱，稍后可编译为知识。</span>${btn('保存资料','save-source','plus','primary')}`);break;}
 case 'source':{
   const s=source(m.id);if(!s){closeModal();return}
   const linked=db.pages.filter(p=>p.sources.includes(s.id));
   const references=linked.length?`<h3 style="font-size:12px;margin-bottom:7px">这份资料滋养了 ${linked.length} 个知识页</h3>`+linked.map(p=>`<button class="aside-link" data-action="open-page" data-id="${esc(p.id)}">${icon('book')}${esc(p.title)}</button>`).join(''):'<p class="read-note">编译后，提炼的要点会成为知识页，并与相关主题连接。</p>';
   const link=safeURL(s.url)?`<a class="text-btn" style="margin-top:13px" href="${esc(safeURL(s.url))}" target="_blank" rel="noopener noreferrer">查看原网页 ${icon('external')}</a>`:'';
   const body=`<div class="source-detail-meta"><span>${esc(s.author||'我的资料')}</span><span>${esc(s.date)}</span><span>${s.content.length} 字</span><span>${s.status==='raw'?'待整理':'已编译'}</span></div>${link}<div class="source-content">${esc(s.content)}</div><div class="card-tags">${tags(s)}</div>${references}`;
   const foot=`<span class="hint">原始资料完整保留，可随时核对。</span>${btn(s.status==='raw'?'编译为知识':'重新编译','compile','spark',s.status==='raw'?'primary':'',`data-id="${esc(s.id)}"`)}`;
   html=modalFrame(esc(s.title),'RAW SOURCE · 原始资料',body,foot);break;
 }
 case 'compile':{const s=source(m.id),related=relatedToSource(s),summary=extract(s.content);html=modalFrame('让这份资料，长成知识','COMPILE PREVIEW · 确认后写入知识库',`<div class="compile-steps">${[['file','保留原始资料'],['layers','提炼知识要点'],['link','关联已有知识']].map(([n,t])=>`<div class="compile-step"><div class="circle">${icon(n)}</div>${t}</div>`).join('')}</div><div class="notice">${icon('info')}<span>演示编译使用正文分句提炼与标签匹配，不调用真实 LLM。你可以修改标题，保存后继续编辑内容。</span></div><div class="field"><label for="compile-title">知识页标题</label><input id="compile-title" maxlength="150" value="${esc(s.title)}"></div><div class="compile-preview"><h3>提炼预览</h3><p>${esc(summary.join(' '))}</p></div><h3 style="font-size:12px;margin:20px 0 5px">建议关联的已有知识</h3>${related.length?related.map(p=>`<label class="related-check"><input type="checkbox" name="compile-link" value="${esc(p.id)}" checked>${esc(p.title)}<small>共享主题</small></label>`).join(''):'<p class="read-note">暂时没有匹配的主题，可在保存后手动建立关联。</p>'}<p id="form-error" class="inline-error" role="alert"></p>`,`<span class="hint">创建 / 更新 1 个资料知识页，并为勾选页面补充来源与反向关系。</span>${btn('确认编译','confirm-compile','check','primary')}`);break;}
 case 'editor':{const p=m.id?page(m.id):null;html=modalFrame(p?'编辑知识页':'新建知识页','用自己的语言，留下一个可以被复用的想法。',`<div class="field"><label for="edit-title">知识标题 *</label><input id="edit-title" maxlength="150" value="${esc(p?.title||'')}"></div><div class="field"><label for="edit-subtitle">一句话描述</label><input id="edit-subtitle" maxlength="200" value="${esc(p?.subtitle||'')}"></div><div class="form-row"><div class="field"><label for="edit-category">知识主题</label><select id="edit-category">${['知识管理','AI','阅读与写作','产品设计'].map(c=>`<option ${p?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label for="edit-tags">标签</label><input id="edit-tags" maxlength="100" placeholder="用逗号分隔" value="${esc(p?.tags.join(', ')||'')}"></div></div><div class="editor-tools"><span class="small muted">支持 # 标题、**加粗**、列表、[[知识链接]]</span></div><textarea id="edit-content" class="editor" maxlength="500000" aria-label="Markdown 内容" placeholder="# 一个值得留下的想法\n\n用自己的话说说你的理解…">${esc(p?.content||'')}</textarea><p id="form-error" class="inline-error" role="alert" style="margin-top:12px"></p>`,`<div>${p?btn('删除知识页','delete-confirm','trash','danger',`data-id="${esc(p.id)}"`):'<span class="hint">让一个想法成为花园中的新节点。</span>'}</div><div class="flex">${btn('取消','close-modal')}${btn('保存知识','save-page','check','primary')}</div>`,true);break;}
 case 'search':html=`<div class="overlay" data-action="overlay-close"><section class="modal search-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title" style="font-size:14px">搜索你的知识花园</h2>${ibtn('close','close-modal','关闭搜索')}</div><div class="modal-body"><div class="search-field">${icon('search')}<input id="global-query" autocomplete="off" placeholder="知识、资料、内容或标签…" aria-label="搜索关键词"></div><div class="search-results" id="search-results">${searchResults('')}</div><div class="search-tip"><span>输入关键词，在原始资料与知识中查找</span><span><kbd>Esc</kbd> 关闭</span></div></div></section></div>`;break;
 case 'fix':{const p=page(m.id),isSource=m.issue==='source',items=isSource?db.sources:db.pages.filter(x=>x.id!==p.id);html=modalFrame(isSource?'给知识补充一份依据':'为这个想法，找到关联',esc(p.title),`<p class="read-note" style="margin-bottom:14px">${isSource?'选择支持这条知识的原始资料。关联后，请核对它是否真正支持页面内容。':'选择有关联的知识页。建议用一句话解释它们之间的联系。'}</p><div style="max-height:330px;overflow:auto">${items.map(x=>`<label class="related-check"><input type="checkbox" name="fix-item" value="${esc(x.id)}" ${(isSource?p.sources:p.links).includes(x.id)?'checked':''}>${esc(x.title)}</label>`).join('')||'<p class="read-note">还没有可以关联的资料，请先添加。</p>'}</div><p id="form-error" class="inline-error" role="alert"></p>`,`<span class="hint">选择由你确认，关系可以随时在编辑时调整。</span>${btn('保存关联','save-fix','check','primary')}`);break;}
 case 'confirm':html=modalFrame(m.title,'此操作会修改当前浏览器保存的数据。',`<p class="read-note" style="font-size:12px;padding:10px 0 20px">${m.description}</p>`,`<span class="hint">${m.hint||'请确认你已保留需要的内容。'}</span><div class="flex">${btn('取消','close-modal')}${btn(m.label||'确认','do-confirm','check','primary')}</div>`);break;
 case 'restore':html=modalFrame('恢复这一份知识花园','BACKUP PREVIEW · 导入预览',`<div class="stats" style="grid-template-columns:repeat(3,1fr)">${[['知识页',m.data.pages.length],['资料',m.data.sources.length],['日志',m.data.logs.length]].map(([t,n])=>`<div class="stat"><span class="stat-label">${t}</span><b class="stat-number">${n}</b></div>`).join('')}</div><p class="read-note">来自「${esc(m.data.settings.name)}」。导入会替换当前浏览器的全部知识数据，建议先导出当前备份。</p>`,`<span class="hint">仅接收知园 v1 JSON 格式。</span>${btn('确认恢复','restore-data','check','primary')}`);break;
 }$('#overlay-root').innerHTML=html;}
 function searchResults(q){const term=q.trim().toLowerCase();let results=[];db.pages.forEach(p=>{if(!term||(p.title+p.content+p.tags.join('')).toLowerCase().includes(term))results.push({...p,entity:'page'})});if(term)db.sources.forEach(s=>{if((s.title+s.content+s.tags.join('')).toLowerCase().includes(term))results.push({...s,entity:'source'})});return results.slice(0,20).map(p=>`<button class="search-result" data-action="${p.entity==='page'?'open-page':'source-detail'}" data-id="${esc(p.id)}"><span class="card-icon">${icon(p.entity==='page'?p.icon:'file')}</span><span class="info"><h3>${esc(p.title)}</h3><p>${esc(p.subtitle||p.content.slice(0,80))}</p></span><span class="kind">${p.entity==='page'?'知识页':'资料'}</span></button>`).join('')||empty('没有找到相关内容','试试更短的关键词，或者搜索标签。','search');}
 function draft(){return {title:$('#source-title')?.value||'',content:$('#source-content')?.value||'',url:$('#source-url')?.value||modal.draft?.url||'',tags:$('#source-tags')?.value||'',author:$('#source-author')?.value||''};}
 const splitTags=s=>[...new Set(s.split(/[,，、]/).map(x=>x.trim()).filter(Boolean))].slice(0,8);
 function error(msg){const el=$('#form-error');if(el)el.textContent=msg;}
 function extract(text){const parts=text.replace(/\r/g,'').split(/(?<=[。！？.!?])\s*|\n+/).map(x=>x.trim()).filter(Boolean);return parts.slice(0,5).map(x=>x.slice(0,450));}
 function relatedToSource(s){return db.pages.map(p=>({p,score:s.tags.filter(t=>p.tags.includes(t)).length})).filter(x=>x.score>0&&!x.p.sources.includes(s.id)).sort((a,b)=>b.score-a.score).slice(0,4).map(x=>x.p);}
 function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name.replace(/[<>:"/\\|?*]/g,'_');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function selected(name){return $(`input[name="${name}"]:checked`).map(x=>x.value);}
 async function fileText(file,maxMB=2){if(!file||file.size>maxMB*1024*1024)throw Error('请选择不超过 '+maxMB+' MB 的文件。');return await file.text();}
 async function act(el,e){const a=el.dataset.action,id=el.dataset.id;
 switch(a){
 case 'navigate':navigate(el.dataset.route);break;
 case 'open-page':navigate('page',id);break;
 case 'topic':filter=el.dataset.topic;libraryQuery='';navigate('library');break;
 case 'mobile-menu':$('#sidebar').classList.toggle('open');$('#mobile-shade').classList.toggle('show');break;
 case 'add-source':openModal('add',{mode:'note'});break;
 case 'source-detail':openModal('source',{id});break;
 case 'close-modal':closeModal();break;
 case 'overlay-close':if(e.target===el)closeModal();break;
 case 'import-tab':modal.draft=draft();modal.mode=el.dataset.mode;renderModal();break;
 case 'save-source':{const d=draft(),mode=modal.mode;if(!d.title.trim()||!d.content.trim()){error('请填写资料标题和正文。');return}if(mode==='link'&&!safeURL(d.url)){error('请填写有效的 http / https 网页链接。');return}const s={id:uid('s'),title:d.title.trim(),content:d.content.trim(),url:mode==='link'?safeURL(d.url):'',type:mode||'note',author:d.author.trim()||'我的资料',date:today(),status:'raw',tags:splitTags(d.tags)};db.sources.unshift(s);log(`收集了「${s.title}」`,'source');if(!persist())return;closeModal();sourceFilter='待整理';navigate('sources');toast('资料已保存，原始内容将完整保留。');break;}
 case 'compile':if(source(id))openModal('compile',{id});break;
 case 'confirm-compile':{const s=source(modal.id),title=$('#compile-title').value.trim();if(!title){error('请给知识页填写标题。');return}let p=db.pages.find(p=>p.origin===s.id);if(db.pages.some(x=>x.title===title&&x.id!==p?.id)){error('这个知识标题已存在，请换一个标题以避免混淆。');return}const ids=selected('compile-link');const category=s.tags.includes('AI')?'AI':s.tags.some(t=>['阅读','写作'].includes(t))?'阅读与写作':s.tags.includes('产品设计')?'产品设计':'知识管理';const related=ids.map(page).filter(Boolean),summary=extract(s.content);const content=`# ${title}\n\n${summary[0]||'本页来自资料编译。'}\n\n## 资料要点\n\n${summary.map(t=>'- '+t).join('\n')}\n\n## 我的思考\n\n在这里补充自己的理解，核对提炼是否准确，并记录下一步想探索的问题。\n\n## 相关知识\n\n${related.length?related.map(x=>'[['+x.title+']]').join('、'):'暂时没有关联，可在编辑时使用双中括号链接已有知识标题。'}\n\n> 此页由本地规则提炼生成，请结合原始资料检查。`;if(!p){p={id:uid('p'),star:false,kind:'资料',icon:'file',tags:clone(s.tags),category,sources:[s.id],links:ids,origin:s.id,title,subtitle:summary[0]?.slice(0,65)||title,content,date:today()};db.pages.unshift(p)}else{Object.assign(p,{title,content,date:today(),links:[...new Set([...p.links,...ids])],subtitle:summary[0]?.slice(0,65)||title});}related.forEach(r=>{if(!r.sources.includes(s.id))r.sources.push(s.id);if(!r.links.includes(p.id))r.links.push(p.id);r.date=today()});s.status='compiled';log(`编译了「${s.title}」，关联 ${related.length} 个知识页`,'compile');if(!persist())return;closeModal();navigate('page',p.id);toast(`编译完成，更新了 ${related.length+1} 个知识页。`);break;}
 case 'new-page':openModal('editor');break;
 case 'edit-page':openModal('editor',{id});break;
 case 'save-page':{const title=$('#edit-title').value.trim(),content=$('#edit-content').value.trim(),old=modal.id?page(modal.id):null;if(!title||!content){error('请填写知识标题和内容。');return}if(db.pages.some(p=>p.title===title&&p.id!==old?.id)){error('知识标题已存在，请使用其他标题。');return}let p=old||{id:uid('p'),kind:'灵感',icon:'pen',star:false,sources:[],links:[]};const oldTitle=p.title;const links=db.settings.autoLink?[...content.matchAll(/\[\[([^\]]+)\]\]/g)].map(m=>db.pages.find(x=>x.title===m[1])).filter(x=>x&&x.id!==p.id).map(x=>x.id):p.links;Object.assign(p,{title,subtitle:$('#edit-subtitle').value.trim()||'一个正在生长的想法',category:$('#edit-category').value,tags:splitTags($('#edit-tags').value),content,date:today(),links:[...new Set(links)]});if(!old)db.pages.unshift(p);else if(oldTitle!==title){db.pages.forEach(x=>{x.content=x.content.split('[['+oldTitle+']]').join('[['+title+']]')})}log(`${old?'更新':'创建'}了「${title}」`);if(!persist())return;closeModal();navigate('page',p.id);toast('知识已保存。');break;}
 case 'star':{const p=page(id);if(p){p.star=!p.star;if(!persist())return;render();toast(p.star?'已收藏，留住这颗灵感。':'已取消收藏。')}break;}
 case 'home-tab':homeTab=el.dataset.tab;render();break;
 case 'filter':filter=el.dataset.filter;render();break;
 case 'source-filter':sourceFilter=el.dataset.filter;render();break;
 case 'view':view=el.dataset.view;render();break;
 case 'search':openModal('search');break;
 case 'graph-select':graphSelected=id;updateGraph();break;
 case 'zoom-in':graphTransform.scale=Math.min(2.3,graphTransform.scale+.15);updateGraph();break;
 case 'zoom-out':graphTransform.scale=Math.max(.35,graphTransform.scale-.15);updateGraph();break;
 case 'graph-reset':graphTransform={scale:1,x:0,y:0};updateGraph();break;
 case 'ask-suggestion':if(route!=='ask')navigate('ask');$('#question').value=el.dataset.question;await submitQuestion();break;
 case 'ask-submit':await submitQuestion();break;
 case 'save-answer':{if(!answer||answer.saved||!answer.pages.length)return;let title=answer.question;let suffix=2;while(db.pages.some(p=>p.title===title))title=answer.question+' · '+suffix++;const p={id:uid('p'),title,subtitle:'一次探索留下的知识 · 本地检索演示',category:answer.pages[0]?.category||'知识管理',kind:'探索',icon:'spark',star:false,date:today(),tags:[...new Set(answer.pages.flatMap(p=>p.tags))].slice(0,4),links:answer.pages.map(p=>p.id),sources:[...new Set(answer.pages.flatMap(p=>p.sources))],content:'# '+title+'\n\n'+answer.content};db.pages.unshift(p);log(`把问题「${answer.question}」存为知识`,'query');if(!persist())return;answer.saved=true;$('#answer-area').innerHTML=answerView();renderShell();toast('探索已存为知识页，可以继续编辑与关联。');break;}
 case 'health-scan':render();toast(`检查完成，发现 ${issues().length} 项待照料。`);break;
 case 'fix-issue':{if(el.dataset.type==='broken'){const p=page(id);p.links=p.links.filter(id=>page(id));p.sources=p.sources.filter(id=>source(id));log(`清理了「${p.title}」的失效引用`,'link');if(persist()){render();toast('失效引用已清理。')}return}if(el.dataset.type==='missing'){openModal('editor',{id});return}openModal('fix',{id,issue:el.dataset.type});break;}
 case 'save-fix':{const p=page(modal.id),ids=selected('fix-item');if(!ids.length){error('请至少选择一项关联。');return}if(modal.issue==='source')p.sources=ids;else{p.links=ids;const newRefs=ids.map(page).filter(Boolean).filter(x=>!p.content.includes('[['+x.title+']]'));if(newRefs.length)p.content+='\n\n## 补充关联\n\n'+newRefs.map(x=>'[['+x.title+']]').join('、')}p.date=today();log(`为「${p.title}」补充了${modal.issue==='source'?'来源':'知识关联'}`,'link');if(!persist())return;closeModal();render();toast('关联已保存，花园又生长了一点。');break;}
 case 'save-settings':{const name=$('#garden-name').value.trim();if(!name){toast('花园名称不能为空。');return}db.settings.name=name;if(persist()){render();toast('花园名称已更新。')}break;}

 case 'reset-confirm':openModal('confirm',{title:'重置演示空间？',description:'你添加的资料、知识页、收藏与问答记录将被初始演示数据替换。此操作无法直接撤销，可先导出备份。',label:'恢复演示数据',operation:'reset'});break;
 case 'delete-confirm':openModal('confirm',{title:'删除这条知识？',description:`「${esc(page(id)?.title)}」将从知识库和图谱移除，相关链接会同步清理。原始资料继续保留。`,label:'删除知识页',operation:'delete',id});break;
 case 'do-confirm':{const operation=modal.operation;if(operation==='reset'){db=clone(window.MG_SEED);if(!persist())return;answer=null;filter='全部';sourceFilter='全部';closeModal();navigate('home');toast('已恢复演示数据。')}if(operation==='delete'){const id=modal.id,p=page(id);db.pages=db.pages.filter(p=>p.id!==id);db.pages.forEach(x=>{x.links=x.links.filter(link=>link!==id);x.content=x.content.split('[['+p.title+']]').join(p.title)});log(`删除了「${p.title}」`);if(!persist())return;closeModal();navigate('library');toast('知识页已删除，原始资料已保留。')}break;}
 }
 }
 let asking=false;
 async function submitQuestion(){if(asking)return;const q=$('#question')?.value.trim();if(!q){toast('先写下一个问题。');$('#question')?.focus();return}asking=true;const button=$('[data-action="ask-submit"]');if(button)button.disabled=true;$('#answer-area').innerHTML='<div class="loading-dots" role="status">正在连接已有的知识</div>';try{await new Promise(resolve=>setTimeout(resolve,450));answer=makeAnswer(q);db.questions=db.questions.filter(x=>x.text!==q);db.questions.unshift({text:q,date:today()});db.questions=db.questions.slice(0,12);log(`探索了「${q}」`,'query');persist();if(route==='ask'){$('#answer-area').innerHTML=answerView();$('#answer-area').scrollIntoView({behavior:'smooth',block:'start'});}}finally{asking=false;if(button?.isConnected)button.disabled=false}}
 document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.stopPropagation();act(el,e).catch(err=>{console.error(err);toast('操作未完成，请重试。')})}});
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openModal('search');return}if(e.key==='Escape'){closeModal();$('#sidebar').classList.remove('open');$('#mobile-shade').classList.remove('show');return}if(modal&&e.key==='Tab'){const focusable=$('#overlay-root button:not(:disabled), #overlay-root input:not(.hidden), #overlay-root select, #overlay-root textarea, #overlay-root a[href]');const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-action]:not(button)')){e.preventDefault();act(e.target,e)}if(e.key==='Enter'&&e.ctrlKey&&e.target.id==='question'){e.preventDefault();submitQuestion()}});
 document.addEventListener('input',e=>{if(e.target.id==='global-query')$('#search-results').innerHTML=searchResults(e.target.value);if(e.target.id==='library-query'){libraryQuery=e.target.value;const pos=e.target.selectionStart;$('#main').innerHTML=libraryView();$('#library-query').focus();$('#library-query').setSelectionRange(pos,pos)}});
 document.addEventListener('change',async e=>{if(e.target.id==='sort'){sort=e.target.value;render()}if(e.target.id==='source-file'){try{const f=e.target.files[0];if(!f)return;if(!/\.(txt|md)$/i.test(f.name))throw Error('目前支持 .txt / .md 文本文件。');const content=await fileText(f);modal.draft=draft();modal.draft.content=content;modal.filename=f.name;if(!modal.draft.title)modal.draft.title=f.name.replace(/\.[^.]+$/,'');renderModal()}catch(err){error(err.message)}}});
 $('#mobile-shade').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#mobile-shade').classList.remove('show')});
 window.addEventListener('hashchange',readRoute);window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const d=JSON.parse(e.newValue);if(validData(d)){db=d;lastSaved=clone(d);render();toast('已同步此浏览器其他标签页的更改。')}}catch{}}});readRoute();if(initialNotice)setTimeout(()=>toast(initialNotice),50);
})();
</script>
</body>
</html>
